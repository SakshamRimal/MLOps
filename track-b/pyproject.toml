[project]
name = "agentify-the-assistant"
version = "2.1.0"
description = "Track B - W15 AI assistant + W16 agentic research loop, with W17 MLOps (uv + MLflow + Evidently AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "openai>=1.51",
    "chromadb>=0.5.15",
    "sentence-transformers>=3.1",
    "tiktoken>=0.8",
    "pypdf>=5.0",
    "httpx>=0.27",
    "starlette>=0.37.2,<0.39.0",
    "streamlit>=1.39",
    "requests>=2.31",
    "mlflow>=2.17",
    "evidently[llm]>=0.5",
    # sentence-transformers imports datasets; datasets 2.x calls pa.PyExtensionType
    # which pyarrow >= 21 removed, breaking every search_kb call (see README W17a)
    "datasets>=3.6",
]

[tool.uv]
package = false
