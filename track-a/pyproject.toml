[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Track A - Data Science MLOps on the Telco Customer Churn dataset (uv + MLflow + Evidently AI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "mlflow>=2.17",
    "evidently>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv]
package = false
